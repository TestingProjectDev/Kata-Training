['kp','Knee push-up','push',0,'Chest · triceps','Hands just wider than shoulders, knees on the floor, body straight from knees to head. Lower your chest to a fist above the floor, then press up.','Easier regression. Move to full push-ups once 15 clean reps feel easy.'],

function home(){const t=tdi(),st=dayStats(t),w=week(),sk=streak(),p=S.plan[t];
return`<div class="row sp" style="margin-bottom:14px">${logo()}<div class="mut" style="text-align:right">Welcome back,<br><b style="color:var(--t)">${esc(S.name)||'Athlete'}</b></div></div>
<div class="g2"><div class="card row sp"><div><div class="mut">This week</div><div class="big">${w[0]}/${w[1]}</div><div class="mut">workouts done</div></div><div class="ring" style="--p:${w[2]};width:64px;height:64px"><i style="width:50px;height:50px;font-size:14px">${w[2]}%</i></div></div>
<div class="card"><div class="mut">Training streak</div><div class="big">🔥 ${sk[0]}</div><div class="mut">days · best ${sk[1]}</div></div></div>
<div class="card"><div class="mut">TODAY · ${DN[t]}</div><h2 style="margin:2px 0">${FOC[t]}</h2>${p.length?`<div class="mut">${p.length} exercises · ${st.t} sets${st.f?' · completed ✓':''}</div><div class="bar"><i style="width:${st.p}%"></i></div><div class="mut" style="margin-bottom:10px">${p.map(e=>XM[e.id][1]).join(' · ')}</div><button class="btn p" style="width:100%" onclick="sd=${t};sub='plan';go('wk')">${st.d?'Continue workout':'Start workout'}</button>`:`<p>😴 Rest day. Sleep, hydrate and eat well; recovery is where you get stronger.</p>`}</div>
<div class="card"><b>⏱ Rest timer</b><div class="row" style="margin-top:8px">${[30,60,90,120].map(s=>`<button class="btn p" style="flex:1" onclick="startT(${s})">${s<60?s+'s':s/60+'m'}</button>`).join('')}</div></div>
<div class="card"><b>Weekly schedule</b>${DN.map((n,i)=>{const s=dayStats(i);return`<div class="dr ${i==t?'td':''}" onclick="sd=${i};sub='plan';go('wk')"><b>${n.slice(0,3)}</b><span>${FOC[i]}</span><em>${s.f?'✓':s.t?s.p+'%':'—'}</em></div>`}).join('')}</div>
<div class="card mut">💡 Warm up for 5 minutes before every session and cool down after. Train with 1–2 reps in reserve, and stop if you feel sharp pain.</div>`}
function wkv(){const seg=`<div class="chips" style="margin-bottom:8px"><button class="chip ${sub=='plan'?'on':''}" onclick="sub='plan';R()">My plan</button><button class="chip ${sub=='lib'?'on':''}" onclick="sub='lib';R()">Exercise library</button></div>`;
if(sub=='lib')return seg+`<input class="in" placeholder="🔍 Search exercises, muscles…" oninput="$('#ll').innerHTML=libl(this.value)" style="margin-bottom:10px"><div id="ll">${libl('')}</div>`;
const di=sd,p=S.plan[di],l=lgr(K(dOf(di))),st=dayStats(di),tot=p.reduce((a,e)=>a+e.s,0);
let h=seg+`<div class="chips">${DN.map((n,i)=>`<button class="chip ${i==di?'on':''}" onclick="sd=${i};ed=0;R()">${n.slice(0,3)}${dayStats(i).f?' ✓':''}</button>`).join('')}</div><div class="row sp" style="margin:10px 0"><div><h2>${DN[di]}</h2><div class="mut">${FOC[di]}${p.length&&!ed?' · '+st.p+'% done':''}</div></div><button class="btn ${ed?'p':''}" onclick="ed=!ed;R()">${ed?'Done':'✎ Edit'}</button></div>`;
if(!ed&&p.length)h+=`<div class="bar"><i style="width:${st.p}%"></i></div><div class="card"><div class="row sp"><b>🔥 Warm-up · 5 min</b><button class="btn ${l.w?'p':''}" onclick="flag('w')">${l.w?'Done ✓':'Mark done'}</button></div><div class="mut" style="margin-top:6px">Easy marching, arm and shoulder circles ×10, cat-cow ×8, wrist circles, 10 bodyweight squats, then 1–2 light sets of your first exercise.</div></div>`;
if(!p.length&&!ed)h+=`<div class="card">😴 Rest day. Sleep, hydrate, eat enough. Light walking is fine; add exercises with Edit if you like.</div>`;
p.forEach(e=>{const x=XM[e.id],a=l.s[e.u]||[];
h+=ed?`<div class="card"><div class="row sp"><b>${x[1]}</b><div class="row"><button class="btn" onclick="mv('${e.u}',-1)">↑</button><button class="btn" onclick="mv('${e.u}',1)">↓</button><button class="btn" onclick="rm('${e.u}')">✕</button></div></div><div class="row" style="margin-top:8px"><label class="mut">Sets<input class="in" type="number" inputmode="numeric" value="${e.s}" onchange="up('${e.u}','s',this.value)"></label><label class="mut">Reps<input class="in" value="${esc(e.r)}" onchange="up('${e.u}','r',this.value)"></label><label class="mut">Rest (s)<input class="in" type="number" inputmode="numeric" value="${e.t}" onchange="up('${e.u}','t',this.value)"></label></div></div>`
:`<div class="card"><div class="row sp"><div onclick="info('${e.id}')" style="flex:1"><b>${x[1]}</b> <span class="mut">ⓘ</span><div class="mut">${e.s} × ${esc(e.r)}${e.t?' · rest '+e.t+'s':''}</div></div>${e.t?`<button class="btn" onclick="startT(${e.t})">⏱ ${e.t}s</button>`:''}</div><div class="sets">${Array.from({length:e.s},(_,i)=>`<div class="s ${a[i]?'d':''}"><b onclick="tg('${e.u}',${i})">${a[i]?'✓':i+1}</b><input type="number" inputmode="numeric" value="${a[i]||''}" placeholder="${num(e.r)||''}" onchange="ed2('${e.u}',${i},this.value)"></div>`).join('')}</div></div>`});
if(ed){if(tot>24)h+=`<div class="card warn">That is a lot of volume (${tot} sets). More is not better: keep sessions under about an hour and leave reps in reserve.</div>`;h+=`<button class="btn p" style="width:100%" onclick="sub='lib';ed=0;R()">＋ Add exercise</button>`}
else if(p.length)h+=`<div class="card"><div class="row sp"><b>🧊 Cool-down · 5 min</b><button class="btn ${l.c?'p':''}" onclick="flag('c')">${l.c?'Done ✓':'Mark done'}</button></div><div class="mut" style="margin-top:6px">Slow breathing for 1 minute, chest and lat stretches, hips, quads and hamstrings 30s each. Drink water.</div></div><button class="btn ${l.fin?'':'p'}" style="width:100%" onclick="fin()">${l.fin?'Completed ✓ (tap to undo)':'Finish workout'}</button>`;
return h}
const libl=q=>X.filter(e=>(e[1]+e[4]+e[5]).toLowerCase().includes(q.toLowerCase())).map(e=>`<div class="card" onclick="info('${e[0]}')"><b>${e[1]}</b><div class="mut">${e[4]}${e[3]?' · bottles':''}</div></div>`).join('')||'<p class="mut">No exercises match.</p>';
function info(id){const e=XM[id];sh(`<h2>${e[1]}</h2><div class="mut">${e[4]}</div>${fig(e)}<h3>How to</h3><p>${e[5]}</p><h3 style="margin-top:8px">Coach tip</h3><p>${e[6]}</p><div class="row" style="margin-top:8px"><select id="ad" class="in">${DN.map((n,i)=>`<option value="${i}" ${i==sd?'selected':''}>${n}</option>`).join('')}</select><button class="btn p" style="white-space:nowrap" onclick="addEx('${id}')">Add to day</button></div><p class="mut">Pain is a stop sign. Keep 1–2 reps in reserve.</p>`)}
function addEx(id){const timed=['pl','hs','fs','ls'].includes(id),rec=['wk','st','mb'].includes(id);S.plan[+$('#ad').value].push({u:'u'+Date.now(),id,s:rec?1:3,r:rec?'10-20 min':timed?'20-30s':'10-12',t:rec?0:60});sv();cl();toast('Added to '+DN[+$('#ad').value]);R()}
const cur=()=>S.plan[sd];
function tg(u,i){const e=cur().find(x=>x.u==u),a=lg(K(dOf(sd))).s[u]||(lg(K(dOf(sd))).s[u]=[]);if(a[i])a[i]=0;else{a[i]=num(e.r)||1;if(S.auto&&e.t)startT(e.t)}for(let j=0;j<i;j++)a[j]=a[j]||0;sv();R()}
function ed2(u,i,v){const a=lg(K(dOf(sd))).s[u]||(lg(K(dOf(sd))).s[u]=[]);a[i]=Math.max(0,Math.min(999,+v||0));sv();R()}
function flag(f){const l=lg(K(dOf(sd)));l[f]=!l[f];sv();R()}
function fin(){const l=lg(K(dOf(sd)));if(l.fin){l.fin=0;sv();return R()}let s=0,r=0;cur().forEach(e=>(l.s[e.u]||[]).slice(0,e.s).forEach(v=>{if(v){s++;if(!/s$|min/.test(e.r))r+=v}}));if(!s)return toast('Log at least one set first');l.fin=1;l.sets=s;l.reps=r;l.day=sd;sv();toast('Workout saved 💪 Rest and refuel');R()}
function up(u,f,v){const e=cur().find(x=>x.u==u);if(f=='s')e.s=Math.min(6,Math.max(1,+v||1));else if(f=='t')e.t=Math.min(300,Math.max(0,+v||0));else e.r=(v||'10').slice(0,20);sv();R()}
function mv(u,d){const p=cur(),i=p.findIndex(x=>x.u==u),j=i+d;if(j<0||j>=p.length)return;[p[i],p[j]]=[p[j],p[i]];sv();R()}
function rm(u){S.plan[sd]=cur().filter(x=>x.u!=u);sv();R()}
function skv(){return`<h2>Skills</h2><p class="mut">Master each stage with clean, short holds before moving on. Stop if you feel wrist, shoulder or neck pain.</p>`+SK.map(k=>{const s=S.sk[k[0]]||{st:0,h:[]},best=Math.max(0,...s.h.filter(x=>x.st==s.st).map(x=>x.sec));
return`<div class="card" style="margin-top:12px"><h3>${k[2]} ${k[1]}</h3><div class="bar"><i style="width:${(s.st+1)/5*100}%"></i></div><div class="mut">Stage ${s.st+1} of 5 · ${s.h.length} sessions logged</div>${k[3].map((x,i)=>`<div class="stg ${i==s.st?'on':''} ${i<s.st?'dn':''}" onclick="setSt('${k[0]}',${i})"><b>${i<s.st?'✓':i+1}</b><div><b>${x[0]}</b><div class="mut">${x[1]}</div></div></div>`).join('')}<div class="row" style="margin-top:10px"><input id="h_${k[0]}" class="in" type="number" inputmode="numeric" placeholder="Best hold today (sec)"><button class="btn p" onclick="lh('${k[0]}')">Log</button></div><div class="mut" style="margin-top:6px">Best at this stage: ${best}s</div><details><summary>Technique tips</summary><ul>${k[4].map(t=>`<li>${t}</li>`).join('')}</ul></details></div>`}).join('')}
function setSt(id,i){const s=S.sk[id]||(S.sk[id]={st:0,h:[]});s.st=i;sv();R()}
function lh(id){const v=+$('#h_'+id).value;if(!v)return toast('Enter seconds held');const s=S.sk[id]||(S.sk[id]={st:0,h:[]});s.h.push({d:K(new Date()),st:s.st,sec:Math.min(v,600)});sv();toast('Logged');R()}
const bars=(v,lb)=>{const m=Math.max(1,...v);return`<div class="bars">${v.map((x,i)=>`<div><span>${x||''}</span><i style="height:${x/m*80}px"></i>${lb[i]}</div>`).join('')}</div>`};
function prv(){const fl=Object.keys(S.log).filter(k=>S.log[k].fin).sort().reverse(),sk=streak();let ws=0,wr=0;fl.forEach(k=>{ws+=S.log[k].sets||0;wr+=S.log[k].reps||0});
const sets=DN.map((_,i)=>dayStats(i).d),wk=[];for(let w=5;w>=0;w--){let n=0;for(let i=0;i<7;i++){const d=mon();d.setDate(d.getDate()-7*w+i);if(lgr(K(d)).fin)n++}wk.push(n)}
return`<h2 style="margin-bottom:10px">Progress</h2><div class="g2"><div class="card"><div class="mut">Workouts</div><div class="big">${fl.length}</div></div><div class="card"><div class="mut">Sets logged</div><div class="big">${ws}</div></div><div class="card"><div class="mut">Total reps</div><div class="big">${wr}</div></div><div class="card"><div class="mut">Streak / best</div><div class="big">${sk[0]}<span class="mut"> / ${sk[1]}</span></div></div></div>
<div class="card"><b>Sets this week</b>${bars(sets,DN.map(n=>n[0]))}</div><div class="card"><b>Workouts per week</b><div class="mut">Last 6 weeks, oldest to newest</div>${bars(wk,['−5','−4','−3','−2','−1','Now'])}</div>
<div class="card"><b>History</b>${fl.length?fl.slice(0,30).map(k=>`<div class="dr"><b style="width:auto;min-width:70px">${k.slice(5)}</b><span>${DN[S.log[k].day||0]} · ${S.log[k].sets} sets · ${S.log[k].reps} reps</span><button class="btn" onclick="delH('${k}')">🗑</button></div>`).join(''):'<p class="mut">Finish a workout to see it here.</p>'}</div>
<div class="card mut">📈 Progress gradually: when you hit the top of your rep range on every set, make the exercise slightly harder (slower tempo, more reps, a heavier backpack or a harder variation). Take an easier week every 4–6 weeks.</div>`}
function delH(k){ask('Delete this workout from your history?',()=>{delete S.log[k];sv();R()})}
function pfv(){const sw=(k,t)=>`<div class="row sp" style="margin:10px 0"><span>${t}</span><button class="sw ${S[k]?'on':''}" onclick="S.${k}=S.${k}?0:1;sv();R()"></button></div>`;
return`<h2 style="margin-bottom:10px">Profile</h2><div class="card"><label class="mut">Your name<input class="in" value="${esc(S.name)}" placeholder="Athlete" maxlength="20" onchange="S.name=this.value;sv();R()"></label>${sw('auto','Auto-start rest timer after each set')}${sw('snd','Timer sound')}</div>
<div class="card"><b>🏠 Your equipment</b><ul><li>Pull-up bar</li><li>Bodyweight</li><li>5 L water bottles (about 5 kg each, full)</li><li>Backpack</li></ul><p class="mut">Light loads work best with slow tempo, pauses and higher reps.</p></div>
<div class="card"><b>🛡 Train smart</b><ul><li>Warm up and cool down every session.</li><li>Stop on sharp or joint pain and see a professional if it lingers.</li><li>Keep 1–2 reps in reserve; do not train to failure daily.</li><li>Sleep, eat and take your rest days.</li><li>Not medical advice. Check with a doctor if unsure.</li></ul></div>
<div class="card"><button class="btn" style="width:100%;margin-bottom:8px" onclick="ask('Restore the default weekly plan? Your history stays.',()=>{S.plan=DEFS().plan;sv();R();toast('Plan restored')})">Restore default plan</button><button class="btn" style="width:100%;color:#ff6b6b" onclick="ask('Erase ALL data including history and skills?',()=>{S=DEFS();sv();R();toast('Data erased')})">Erase all data</button></div>`}
const V={home,wk:wkv,sk:skv,pr:prv,pf:pfv},NV=[['home','🏠','Home'],['wk','🏋️','Workouts'],['sk','🎯','Skills'],['pr','📈','Progress'],['pf','👤','Profile']];
function R(){const y=scrollY;$('#v').innerHTML=V[tab]();$('#nv').innerHTML=NV.map(n=>`<button class="${tab==n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('');scrollTo(0,y)}
function go(t){tab=t;if(t=='wk'&&sub=='lib'&&!ed)sub=sub;scrollTo(0,0);R()}
R();
</script></body></html>
